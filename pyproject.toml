[project]
name = "launcher"
version = "0.1.0"
description = "Personal app, file, clipboard and snippet launcher for GNOME on Wayland"
requires-python = ">=3.12"
# PyGObject, GTK 4 and libadwaita come from the system (python3-gi, gir1.2-gtk-4.0,
# gir1.2-adw-1); the venv is created with --system-site-packages to see them.
dependencies = []

[project.scripts]
launcher = "launcher.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
